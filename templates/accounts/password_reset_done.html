{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Inbox - KinetiQ</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- KinetiQ Brand & Theme Refresh -->
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    <style>
        body { font-family: var(--crm-font-body); background-color: #F8FAFC; color: #1E293B; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 15px; }
        .auth-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); max-width: 440px; width: 100%; padding: 40px 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="mb-4">
            <a href="/" class="text-decoration-none d-inline-block">
                {% include "components/brand_logo.html" with theme="light" size="fs-3" %}
            </a>
        </div>
        <i class="bi bi-envelope-check-fill fs-1 text-success mb-3"></i>
        <h4 class="fw-bold mb-2">Check your email</h4>
        <p class="text-muted small mb-4">
            If an account exists with the email you entered, we have sent instructions to reset your password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary px-4 py-2" style="border-radius: 10px;">
            Return to Login
        </a>
    </div>
</body>
</html>
