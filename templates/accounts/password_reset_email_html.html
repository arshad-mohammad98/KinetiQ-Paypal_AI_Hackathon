<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 540px; margin: 0 auto; padding: 32px 24px; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0;">
    <div style="margin-bottom: 24px;">
        <span style="font-size: 26px; font-weight: 700; color: #0f172a; text-decoration: none; letter-spacing: -0.5px;">Kineti<span style="font-size: 36px; font-weight: 800; color: #4f46e5; vertical-align: -2px; line-height: 0.85;">Q</span></span>
    </div>
    <h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 16px;">Password Reset Request</h2>
    <p style="font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px;">
        Hello, you requested a password reset for your KinetiQ account. Click the button below to choose a new password:
    </p>
    <div style="margin-bottom: 24px;">
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="background-color: #4f46e5; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block;">
            Reset My Password
        </a>
    </div>
    <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px;">
        If you did not request this change, you can safely ignore this email.
    </p>
    <div style="border-top: 1px solid #f1f5f9; padding-top: 16px; font-size: 13px; color: #64748b;">
        — The KinetiQ Team
    </div>
</div>
